<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Edge-to-edge version for phone home screens (Android maskable, iOS):
       the OS applies its own shape, so no rounded corners here, and the coin
       sits inside the central safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <circle cx="256" cy="262" r="158" fill="#065f46" opacity="0.25"/>
    <circle cx="256" cy="252" r="158" fill="url(#coin)"/>
    <circle cx="256" cy="252" r="128" fill="none" stroke="#b45309" stroke-opacity="0.35" stroke-width="10"/>
    <g stroke="#065f46" stroke-width="46" stroke-linecap="round" fill="none">
      <line x1="210" y1="180" x2="210" y2="324"/>
      <path d="M318 180 L222 252 L322 324" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
