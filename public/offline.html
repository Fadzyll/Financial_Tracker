<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · KiraDuit</title>
<style>
  :root { --bg:#f6f7f9; --text:#111827; --muted:#6b7280; --brand:#047857; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0f14; --text:#e5e7eb; --muted:#9ca3af; --brand:#34d399; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; text-align:center; }
  img { width:64px; height:64px; }
  p { color:var(--muted); max-width:28rem; }
  button { margin-top:12px; min-height:44px; padding:0 20px; border:0; border-radius:12px; background:var(--brand); color:#fff; font-weight:600; font-size:15px; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon.svg" alt="">
    <h1>You're offline</h1>
    <p>Connect to the internet to see your latest data.<br>Anda di luar talian. Sambung ke internet untuk lihat data terkini.</p>
    <button onclick="location.reload()">Try again / Cuba lagi</button>
  </main>
</body>
</html>
